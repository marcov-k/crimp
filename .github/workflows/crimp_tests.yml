name: Crimp Test Suite

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset x64-debug-tests

      - name: Build Crimp
        run: cmake --build --preset x64-debug-tests

      - name: Run CTest
        run: ctest --preset x64-debug-tests --output-junit test-results.xml --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Update test results badge
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path "test-results.xml"))
          {
            Write-Host "No test results available"
            exit 0
          }

          [xml]$results = Get-Content "test-results.xml"

          $total = [int]$results.testsuites.tests
          $failed = [int]$results.testsuites.failures + [int]$results.testsuites.errors
          $skipped = [int]$results.testsuites.skipped
          $passed = $total - $failed - $skipped

          $badge = "![Tests](https://img.shields.io/badge/Tests-$passed%20passed%2C%20$failed%20failed-brightgreen)"

          $readme = Get-Content README.md -Raw

          $readme = $readme -replace '(?s)(<!-- TEST_RESULTS_START -->).*?(<!-- TEST_RESULTS_END -->)', "`$1`n$badge`n`$2"

      - name: Commit updated test results
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if (-not (git diff --cached --quiet))
          {
            git commit -m "Update test results badge"
            git push
          }
