name: Crimp Test Suite

on:
  workflow_dispatch:
  workflow_call:

jobs:
  run-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset x64-debug-tests

      - name: Build Crimp
        run: cmake --build --preset x64-debug-tests

      - name: Run CTest
        shell: pwsh
        run: |
          $BUILD_FILE = Get-ChildItem -Path . -Filter "crimp_tests.exe" -Recurse -File | Select-Object -First 1

          if ($null -eq $BUILD_FILE)
          {
            throw "Could not find crimp_tests.exe"
          }

          cd $BUILD_FILE.DirectoryName

          ctest
